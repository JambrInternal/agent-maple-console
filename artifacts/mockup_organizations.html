<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Maple Console - Your Organizations</title>
    <link rel="stylesheet" href="mockup_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .org-select-card {
            background: var(--am-bg-1);
            border: 1px solid var(--am-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 320px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .org-select-card:hover {
            border-color: var(--am-accent);
            background: rgba(194, 106, 46, 0.05);
        }

        .org-icon-placeholder {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--am-text-2);
        }
    </style>
</head>

<body class="am-app-shell" style="grid-template-columns: 0 1fr;"> <!-- No sidebar on this page -->
    <header>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 24px; height: 24px; background: var(--am-accent); border-radius: 4px;"></div>
            <span style="font-weight: 500; font-size: 14px;">Organizations</span>
        </div>
        <div style="flex: 1;"></div>
        <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--am-text-2);">
            <span>Feedback</span>
            <div style="width: 28px; height: 28px; background: var(--am-border); border-radius: 50%;"></div>
        </div>
    </header>

    <main>
        <div class="view-content" style="max-width: 1200px;">
            <div class="view-header" style="margin-bottom: 40px; margin-top: 20px;">
                <h1>Your Organizations</h1>
                <button class="btn btn-primary" style="background: var(--am-success);">+ New organization</button>
            </div>

            <div style="margin-bottom: 16px; position: relative; width: 320px;">
                <input type="text" placeholder="Search for an organization"
                    style="width: 100%; padding: 8px 12px; background: var(--am-bg-1); border: 1px solid var(--am-border); border-radius: 6px; color: white; font-size: 13px;">
            </div>

            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="org-select-card">
                    <div class="org-icon-placeholder">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5">
                            <path d="M12 2H2v10h10V2z" />
                            <path d="M22 2h-10v10h10V2z" />
                            <path d="M12 12H2v10h10V12z" />
                            <path d="M22 12h-10v10h10V12z" />
                        </svg>
                    </div>
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">Bushy Tailed</div>
                        <div style="font-size: 12px; color: var(--am-text-3);">Free Plan • 1 project</div>
                    </div>
                </div>

                <div class="org-select-card">
                    <div class="org-icon-placeholder">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5">
                            <path d="M12 2H2v10h10V2z" />
                            <path d="M22 2h-10v10h10V2z" />
                            <path d="M12 12H2v10h10V12z" />
                            <path d="M22 12h-10v10h10V12z" />
                        </svg>
                    </div>
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">SnapTrade</div>
                        <div style="font-size: 12px; color: var(--am-text-3);">Free Plan • 1 project</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
