<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Maple Console - Voice</title>
    <link rel="stylesheet" href="mockup_style.css">
    <style>
        .audio-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .waveform-mini {
            flex: 1;
            height: 24px;
            background: rgba(194, 106, 46, 0.1);
            border-radius: 4px;
            position: relative;
        }

        .waveform-bar {
            position: absolute;
            bottom: 0;
            width: 2px;
            background: var(--am-accent);
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="am-app-shell">
        <aside class="sidebar">
            <div class="nav-icon" title="Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </div>
            <div class="nav-icon active" title="Threads">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            <div class="nav-icon" title="Knowledge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <ellipse cx="12" cy="5" rx="9" ry="3" />
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                </svg>
            </div>
            <div class="nav-icon" title="Contacts">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
            </div>
            <div class="nav-icon" title="Insights">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="18" y1="20" x2="18" y2="10" />
                    <line x1="12" y1="20" x2="12" y2="4" />
                    <line x1="6" y1="20" x2="6" y2="14" />
                </svg>
            </div>
            <div style="flex: 1;"></div>
            <div class="nav-icon" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </div>
        </aside>

        <header>
            <div class="breadcrumbs">
                <span class="breadcrumb-item">
                    Iron Maple
                </span>
                <span class="breadcrumb-sep">/</span>

                <span class="breadcrumb-item active">
                    Voice
                </span>
            </div>
        </header>

        <main>
            <div class="view-content">
                <div class="view-header">
                    <div>
                        <h1>Voice Recordings</h1>
                        <p class="subtitle">Listen to and review call transcripts handled by the AI dispatcher.</p>
                    </div>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Caller</th>
                            <th>Status</th>
                            <th>Duration</th>
                            <th>Preview & Actions</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Joe (GC Super)</td>
                            <td><span class="badge badge-success">Recovered Lead</span></td>
                            <td>2:45</td>
                            <td style="min-width: 300px;">
                                <div class="audio-row">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8 5v14l11-7z" />
                                    </svg>
                                    <div class="waveform-mini">
                                        <div class="waveform-bar" style="height: 40%; left: 5%;"></div>
                                        <div class="waveform-bar" style="height: 60%; left: 15%;"></div>
                                        <div class="waveform-bar" style="height: 30%; left: 25%;"></div>
                                        <div class="waveform-bar" style="height: 80%; left: 35%;"></div>
                                        <div class="waveform-bar" style="height: 50%; left: 45%;"></div>
                                    </div>
                                    <button class="btn"
                                        style="padding: 2px 6px; font-size: 11px; background: var(--am-bg-1); border: 1px solid var(--am-border); color: var(--am-text-2);">Transcript</button>
                                </div>
                            </td>
                            <td>10m ago</td>
                        </tr>
                        <tr>
                            <td>Unknown (+1-415...)</td>
                            <td><span class="badge badge-warning">Missed</span></td>
                            <td>0:12</td>
                            <td>
                                <span style="color: var(--am-text-3);">No recording - User hung up during
                                    greeting</span>
                            </td>
                            <td>1h ago</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>

</html>
