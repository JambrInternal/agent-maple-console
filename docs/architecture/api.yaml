openapi: 3.1.0
info:
  title: CERTLY API
  description: CERTLY API
  version: 0.0.1
  contact: {}
paths:
  /datasources/upload:
    post:
      tags:
      - Datasources
      summary: Upload File
      description: "Upload a file directly to the datasource system.\n\nThis endpoint\
        \ handles the complete upload process:\n1. Validates file type and size (via\
        \ dependency)\n2. Calculates file hash for deduplication\n3. Checks if file\
        \ already exists (returns existing if found)\n4. Uploads to S3 if new\n5.\
        \ Creates database record\n6. Extracts knowledge to Graphiti graph (for PDFs,\
        \ if enabled)\n\nArgs:\n    validated_file: Validated file data (injected\
        \ by dependency)\n    metadata: Optional JSON string for additional metadata\n\
        \    datasource_service: Injected datasource service\n    current_user: Current\
        \ authenticated user with permissions\n\nReturns:\n    Complete datasource\
        \ details including S3 URL"
      operationId: upload_file_datasources_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_datasources_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_DatasourceDetailResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /datasources/sync-google-drive:
    post:
      tags:
      - Datasources
      summary: Sync Google Drive
      description: "Sync files from Google Drive to datasources with per-folder real-time\
        \ monitoring.\n\nThis endpoint:\n1. Sets up one Watch API channel per folder\
        \ for real-time synchronization (immediate)\n2. Starts background file sync:\
        \ lists, downloads, and uploads files to S3 (async)\n\nThe endpoint returns\
        \ immediately after setting up watches. File synchronization\ncontinues in\
        \ the background.\n\nArgs:\n    sync_request: Request containing folder IDs\
        \ and recursive flag\n    cloud_storage_sync_service: Injected sync service\n\
        \    token_service: Injected token service\n    current_user: Current authenticated\
        \ user with permissions\n\nReturns:\n    Watch setup status (file sync happens\
        \ in background)"
      operationId: sync_google_drive_datasources_sync_google_drive_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleDriveSyncRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_GoogleDriveSyncResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /datasources:
    get:
      tags:
      - Datasources
      summary: List Datasources
      description: "List all datasources for the current tenant.\n\nArgs:\n    source:\
        \ Optional source filter\n    datasource_service: Injected datasource service\n\
        \    current_user: Current authenticated user with permissions\n\nReturns:\n\
        \    List of all datasources for the tenant"
      operationId: list_datasources_datasources_get
      parameters:
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter datasources by source
          title: Source
        description: Filter datasources by source
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_list_DatasourceDetailResponse__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /datasources/sharepoint-config:
    get:
      tags:
      - Datasources
      summary: Get Sharepoint Config
      description: "Get all SharePoint watch configurations for the tenant.\n\nThis\
        \ endpoint returns information about which SharePoint folders are\nbeing monitored\
        \ for automatic synchronization. SharePoint uses a single\nwatch for all folders,\
        \ but this endpoint returns one entry per folder.\n\nArgs:\n    cloud_storage_watch_service:\
        \ Injected watch service\n    current_user: Current authenticated user with\
        \ permissions\n\nReturns:\n    List of watch configurations, one per monitored\
        \ folder"
      operationId: get_sharepoint_config_datasources_sharepoint_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_list_SharePointWatchConfigResponse__'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /datasources/google-drive-config:
    get:
      tags:
      - Datasources
      summary: Get Google Drive Config
      description: "Get all Google Drive watch configurations for the tenant.\n\n\
        This endpoint returns information about which Google Drive folders are\nbeing\
        \ monitored for automatic synchronization. Each folder has its own\nwatch\
        \ configuration.\n\nArgs:\n    cloud_storage_watch_service: Injected watch\
        \ service\n    current_user: Current authenticated user with permissions\n\
        \nReturns:\n    List of watch configurations, one per monitored folder"
      operationId: get_google_drive_config_datasources_google_drive_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_list_GoogleDriveWatchConfigResponse__'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /datasources/{datasource_id}:
    get:
      tags:
      - Datasources
      summary: Get Datasource
      description: "Get details of a specific datasource.\n\nArgs:\n    datasource_id:\
        \ ID of the datasource to retrieve\n    datasource_service: Injected datasource\
        \ service\n    current_user: Current authenticated user with permissions\n\
        \nReturns:\n    Datasource details"
      operationId: get_datasource_datasources__datasource_id__get
      parameters:
      - name: datasource_id
        in: path
        required: true
        schema:
          type: integer
          title: Datasource Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_DatasourceDetailResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Datasources
      summary: Delete Datasource
      description: "Soft delete a datasource.\n\nArgs:\n    datasource_id: ID of the\
        \ datasource to delete\n    datasource_service: Injected datasource service\n\
        \    current_user: Current authenticated user with permissions\n\nReturns:\n\
        \    Success message"
      operationId: delete_datasource_datasources__datasource_id__delete
      parameters:
      - name: datasource_id
        in: path
        required: true
        schema:
          type: integer
          title: Datasource Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /datasources/{datasource_id}/reprocess:
    post:
      tags:
      - Datasources
      summary: Reprocess Datasource
      description: "Retrigger the file embedding event for a datasource.\n\nArgs:\n\
        \    datasource_id: ID of the datasource to reprocess\n    datasource_service:\
        \ Injected datasource service\n    current_user: Current authenticated user\
        \ with permissions\n\nReturns:\n    Success message"
      operationId: reprocess_datasource_datasources__datasource_id__reprocess_post
      parameters:
      - name: datasource_id
        in: path
        required: true
        schema:
          type: integer
          title: Datasource Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /datasources/{datasource_id}/download-url:
    get:
      tags:
      - Datasources
      summary: Get Download Url
      description: "Generate a presigned download URL for a datasource.\n\nArgs:\n\
        \    datasource_id: ID of the datasource to download\n    datasource_service:\
        \ Injected datasource service\n    current_user: Current authenticated user\
        \ with permissions\n\nReturns:\n    Presigned download URL valid for 1 hour"
      operationId: get_download_url_datasources__datasource_id__download_url_get
      parameters:
      - name: datasource_id
        in: path
        required: true
        schema:
          type: integer
          title: Datasource Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_DatasourceDownloadUrlResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /datasources/google-drive-webhook:
    post:
      tags:
      - Datasources
      summary: Google Drive Webhook
      description: "Webhook endpoint for Google Drive change notifications.\n\nThis\
        \ endpoint handles real-time notifications from Google Drive Watch API\nand\
        \ synchronizes changes (new files, updated files, deleted files).\n\nHeaders:\n\
        \    X-Goog-Channel-ID: Channel ID from watch setup\n    X-Goog-Resource-State:\
        \ State of the resource (sync, add, remove, update, trash, untrash, change)"
      operationId: google_drive_webhook_datasources_google_drive_webhook_post
      parameters:
      - name: x-goog-channel-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Goog-Channel-Id
      - name: x-goog-resource-state
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Goog-Resource-State
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /datasources/sync-sharepoint:
    post:
      tags:
      - Datasources
      summary: Sync Sharepoint
      description: "Sync files from SharePoint to datasources with per-folder real-time\
        \ monitoring.\n\nThis endpoint:\n1. Sets up one Watch API channel per folder\
        \ for real-time synchronization (immediate)\n2. Starts background file sync:\
        \ lists, downloads, and uploads files to S3 (async)\n\nThe endpoint returns\
        \ immediately after setting up watches. File synchronization\ncontinues in\
        \ the background.\n\nArgs:\n    sync_request: Request containing folder IDs\
        \ and recursive flag\n    cloud_storage_sync_service: Injected sync service\n\
        \    token_service: Injected token service\n    current_user: Current authenticated\
        \ user with permissions\n\nReturns:\n    Watch setup status (file sync happens\
        \ in background)"
      operationId: sync_sharepoint_datasources_sync_sharepoint_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePointSyncRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_SharePointSyncResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /datasources/sharepoint-webhook:
    post:
      tags:
      - Datasources
      summary: Sharepoint Webhook
      description: "Webhook endpoint for SharePoint/OneDrive change notifications.\n\
        \nMicrosoft Graph sends notifications when files change in monitored folders\n\
        and synchronizes changes (new files, updated files, deleted files).\n\nNote:\
        \ SharePoint subscriptions are created at the root level, but we filter\n\
        changes to only process files in the folders specified in the watch record.\n\
        \nValidation:\n    When setting up a subscription, Microsoft Graph sends a\
        \ validation request\n    with a validationToken query parameter that must\
        \ be returned in plain text.\n\nNotification:\n    After validation, Microsoft\
        \ Graph sends POST requests with notification data\n    containing the subscription\
        \ ID and change information."
      operationId: sharepoint_webhook_datasources_sharepoint_webhook_post
      parameters:
      - name: validationToken
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Validationtoken
      - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /file-chunks:
    get:
      tags:
      - File Chunks
      summary: List File Chunks
      description: "Get all file chunk embeddings, optionally filtered by datasource.\n\
        \nArgs:\n    datasource_id: Optional datasource ID filter\n    status_filter:\
        \ Optional status filter\n    element_type_filter: Optional element type filter\n\
        \    sort_by: Field to sort by (id, created_at, status)\n    sort_order: Sort\
        \ order (asc or desc)\n    db: Database session\n    current_user: Current\
        \ authenticated user with permissions\n\nReturns:\n    List of file chunk\
        \ embeddings sorted and filtered"
      operationId: list_file_chunks_file_chunks_get
      parameters:
      - name: datasource_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by datasource ID
          title: Datasource Id
        description: Filter by datasource ID
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status (FAILED, COMPLETED, IN_PROGRESS, NOT_STARTED)
          title: Status
        description: Filter by status (FAILED, COMPLETED, IN_PROGRESS, NOT_STARTED)
      - name: element_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by element type (TEXT, IMAGE_PAGE)
          title: Element Type
        description: Filter by element type (TEXT, IMAGE_PAGE)
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort by field (id, created_at, status)
          default: id
          title: Sort By
        description: Sort by field (id, created_at, status)
      - name: sort_order
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort order (asc, desc)
          default: asc
          title: Sort Order
        description: Sort order (asc, desc)
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_List_FileChunkEmbeddingResponse__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /file-chunks/{chunk_id}/reprocess:
    post:
      tags:
      - File Chunks
      summary: Reprocess Chunk
      description: "Re-process a single chunk by resending it to SQS using send_chunk_processing_messages.\n\
        \nArgs:\n    chunk_id: ID of the chunk to reprocess\n    db: Database session\n\
        \    chunk_processor: Chunk processor service\n    current_user: Current authenticated\
        \ user with permissions\n\nReturns:\n    Success message"
      operationId: reprocess_chunk_file_chunks__chunk_id__reprocess_post
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: integer
          title: Chunk Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /file-chunks/reprocess-batch:
    post:
      tags:
      - File Chunks
      summary: Reprocess Chunks Batch
      description: "Re-process multiple chunks by resending them to SQS.\n\nArgs:\n\
        \    request: List of chunk IDs to reprocess\n    db: Database session\n \
        \   chunk_processor: Chunk processor service\n    current_user: Current authenticated\
        \ user with permissions\n\nReturns:\n    Success message with count"
      operationId: reprocess_chunks_batch_file_chunks_reprocess_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /file-chunks/delete-batch:
    post:
      tags:
      - File Chunks
      summary: Delete Chunks Batch
      description: "Delete multiple chunks and their associated Graphiti episodes.\n\
        \nArgs:\n    request: List of chunk IDs to delete\n    db: Database session\n\
        \    file_graphiti_service: Service for Graphiti operations\n    current_user:\
        \ Current authenticated user with permissions\n\nReturns:\n    Success message\
        \ with count"
      operationId: delete_chunks_batch_file_chunks_delete_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - $ref: '#/components/parameters/TenantIdHeader'
  /audio-conversations/{template_id}:
    get:
      tags:
      - Audio Conversations
      summary: Get Template Audio Conversations
      description: 'Get all audio conversations for a template.


        Requires instructor:course:read permission.'
      operationId: get_template_audio_conversations_audio_conversations__template_id__get
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: integer
          title: Template Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioConversationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audio-conversations/session/{session_id}:
    get:
      tags:
      - Audio Conversations
      summary: Get Audio Conversation By Session
      description: 'Get audio conversation by session ID.


        Requires instructor:course:read permission.'
      operationId: get_audio_conversation_by_session_audio_conversations_session__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioConversationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Audio Conversations
      summary: Delete Audio Conversation
      description: 'Delete audio conversation.


        Note: This only deletes the database record, not the S3 file.

        Requires instructor:course:write permission.'
      operationId: delete_audio_conversation_audio_conversations_session__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audio-conversations/session/{session_id}/download-url:
    get:
      tags:
      - Audio Conversations
      summary: Get Audio Download Url
      description: 'Get presigned URL for downloading audio file.


        The URL expires after the specified time (default: 1 hour, max: 24 hours).

        Requires instructor:course:read permission.'
      operationId: get_audio_download_url_audio_conversations_session__session_id__download_url_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: expires_in
        in: query
        required: false
        schema:
          type: integer
          default: 3600
          title: Expires In
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audio-conversations/user/{user_id}:
    get:
      tags:
      - Audio Conversations
      summary: Get User Audio Conversations
      description: 'Get all audio conversations for a user.


        Requires instructor:course:read permission.'
      operationId: get_user_audio_conversations_audio_conversations_user__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioConversationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audio-conversations/user/{user_id}/template/{template_id}:
    get:
      tags:
      - Audio Conversations
      summary: Get User Template Audio Conversations
      description: 'Get audio conversations for a specific user in a specific template.


        Requires instructor:course:read permission.'
      operationId: get_user_template_audio_conversations_audio_conversations_user__user_id__template__template_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: template_id
        in: path
        required: true
        schema:
          type: integer
          title: Template Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioConversationListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audio-conversations/user/{user_id}/twilio:
    get:
      tags:
      - Audio Conversations
      summary: Get Twilio Conversation By User
      description: 'Get Twilio audio conversations for a user (conversations without
        template_id).


        Requires instructor:course:read permission.'
      operationId: get_twilio_conversation_by_user_audio_conversations_user__user_id__twilio_get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioConversationResponse'
                title: Response Get Twilio Conversation By User Audio Conversations
