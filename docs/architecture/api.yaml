components:
  schemas:
    AcceptInvitationRequest:
      properties:
        token:
          type: string
          title: Token
      type: object
      required:
      - token
      title: AcceptInvitationRequest
    AudioConversationListResponse:
      properties:
        conversations:
          items:
            $ref: '#/components/schemas/AudioConversationResponse'
          type: array
          title: Conversations
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - conversations
      - total
      - limit
      - offset
      title: AudioConversationListResponse
      description: List of audio conversations.
    AudioConversationResponse:
      properties:
        id:
          type: integer
          title: Id
        session_id:
          type: string
          title: Session Id
        user_id:
          type: string
          title: User Id
        template_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Template Id
        audio_s3_key:
          type: string
          title: Audio S3 Key
        recording_metadata:
          additionalProperties: true
          type: object
          title: Recording Metadata
        message_transcriptions:
          items: {}
          type: array
          title: Message Transcriptions
          description: Real-time conversation message transcriptions
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - session_id
      - user_id
      - audio_s3_key
      - recording_metadata
      - created_at
      - updated_at
      title: AudioConversationResponse
      description: Audio conversation response model.
    BaseResponse:
      properties:
        code:
          type: integer
          title: Code
          default: 200
        success:
          type: boolean
          title: Success
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: BaseResponse
    Body_upload_file_datasources_upload_post:
      properties:
        metadata:
          anyOf:
          - type: string
          - type: 'null'
          title: Metadata
          description: Optional JSON metadata string
        file:
          type: string
          format: binary
          title: File
          description: File to upload
      type: object
      required:
      - file
      title: Body_upload_file_datasources_upload_post
    ChatConversationParameterTemplateCreateRequest:
      properties:
        template_type:
          type: string
          enum:
          - PARAMETERIZED
          - FULL_CONTROLLED
          title: Template Type
          description: Type of template (parameterized or full_controlled)
          default: FULL_CONTROLLED
        runner_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Instructions
          description: Instructions for the runner (used in full_controlled mode)
        agent_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Instructions
          description: Instructions for the agent (used in full_controlled mode)
        user_role:
          type: string
          title: User Role
          description: Role of the user (e.g., sales, tech_support, student)
        conversation_type:
          type: string
          title: Conversation Type
          description: Type of conversation (e.g., sales, tech_support, teaching)
        ai_role:
          type: string
          title: Ai Role
          description: Role of the AI (e.g., customer, device_user, course_learner)
        ai_role_characteristics:
          items:
            type: string
          type: array
          title: Ai Role Characteristics
          description: Characteristics of the AI role
        ai_role_emotional_tone:
          items:
            type: string
          type: array
          title: Ai Role Emotional Tone
          description: Emotional tone of the AI role
        ai_role_dialogue_strategy:
          items:
            type: string
          type: array
          title: Ai Role Dialogue Strategy
          description: AI role's dialogue strategy
        ai_role_constraints:
          items:
            type: string
          type: array
          title: Ai Role Constraints
          description: Rules or constraints the AI must follow
        context_content:
          anyOf:
          - type: string
          - type: 'null'
          title: Context Content
          description: Context content
        context_course_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context Course Id
          description: Context course ID
        context_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Context File Id
          description: Context file ID
        goals:
          items:
            type: string
          type: array
          title: Goals
          description: Goals of the conversation
        evaluation_criteria:
          items:
            type: string
          type: array
          title: Evaluation Criteria
          description: Evaluation criteria
        is_default:
          type: boolean
          title: Is Default
          description: Whether this template is the default for the tenant
          default: false
      type: object
      required:
      - user_role
      - conversation_type
      - ai_role
      - ai_role_characteristics
      - ai_role_emotional_tone
      - ai_role_dialogue_strategy
      - ai_role_constraints
      - goals
      - evaluation_criteria
      title: ChatConversationParameterTemplateCreateRequest
    ChatConversationParameterTemplatePatchRequest:
      properties:
        template_type:
          anyOf:
          - type: string
            enum:
            - PARAMETERIZED
            - FULL_CONTROLLED
          - type: 'null'
          title: Template Type
          description: Type of template
        runner_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Runner Instructions
          description: Instructions for the runner
        agent_instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Instructions
          description: Instructions for the agent
        user_role:
          anyOf:
          - type: string
          - type: 'null'
          title: User Role
          description: Role of the user
        conversation_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Type
          description: Type of conversation
        ai_role:
          anyOf:
          - type: string
          - type: 'null'
          title: Ai Role
          description: Role of the AI
        ai_role_characteristics:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Ai Role Characteristics
